version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: craftgali
      POSTGRES_USER: craftgali
      POSTGRES_PASSWORD: craftgali_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://craftgali:craftgali_dev@db:5432/craftgali?sslmode=disable
      JWT_SECRET: dev-secret-change-in-production
    depends_on:
      - db

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
