openapi: "3.0.3"
info:
  title: Craftgali API
  version: 0.1.0
  description: REST API for the Craftgali marketplace
servers:
  - url: http://localhost:8080/api/v1
    description: Local development

paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK

  /auth/register:
    post:
      summary: Register new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, role]
              properties:
                email:    { type: string, format: email }
                password: { type: string, minLength: 8 }
                role:     { type: string, enum: [artist, collector] }
      responses:
        '201': { description: User created }
        '409': { description: Email already exists }

  /auth/login:
    post:
      summary: Login and receive JWT
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: JWT token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }

  /listings:
    get:
      summary: List artworks with location/radius filtering
      tags: [Listings]
      parameters:
        - name: lat
          in: query
          schema: { type: number }
        - name: lng
          in: query
          schema: { type: number }
        - name: radius_km
          in: query
          schema: { type: number }
      responses:
        '200':
          description: Paginated listings

    post:
      summary: Create new listing (artist only)
      tags: [Listings]
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Listing created }

  /auctions:
    post:
      summary: Create auction for a listing
      tags: [Auctions]
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Auction created }

  /auctions/{id}/bid:
    post:
      summary: Place a bid
      tags: [Auctions]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Bid placed }
        '409': { description: Bid too low or auction ended }

  /escrow:
    post:
      summary: Create escrow transaction (UPI)
      tags: [Escrow]
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Escrow created }

  /messages:
    get:
      summary: List conversations
      tags: [Messaging]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Conversations list }

  /portfolio/{username}:
    get:
      summary: Public artist portfolio
      tags: [Portfolio]
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Artist portfolio }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
